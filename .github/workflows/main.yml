name: Build HNStudio Musik AI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check project
        shell: pwsh
        run: |
          if (!(Test-Path "CMakeLists.txt")) {
            Write-Error "CMakeLists.txt not found"
            exit 1
          }

          if (!(Test-Path "Source")) {
            Write-Error "Source folder not found"
            exit 1
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Find EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem "build" -Filter "*.exe" -Recurse -File |
            Where-Object { $_.Name -notmatch "uninstall" } |
            Select-Object -First 1

          if ($null -eq $exe) {
            Write-Error "EXE was not generated"
            exit 1
          }

          New-Item -ItemType Directory -Force "package" | Out-Null

          Copy-Item $exe.FullName "package\HNStudio-Musik-AI.exe"

      - name: Copy Assets
        shell: pwsh
        run: |
          if (Test-Path "Assets") {
            Copy-Item "Assets" "package\Assets" -Recurse -Force
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "package\*" `
            -DestinationPath "HNStudio-Musik-AI-Windows-x64.zip" `
            -Force

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HNStudio-Musik-AI-Windows-x64
          path: HNStudio-Musik-AI-Windows-x64.zip
